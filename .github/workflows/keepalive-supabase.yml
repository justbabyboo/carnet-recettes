name: Keep Supabase awake

# Garde le projet Supabase actif : le plan gratuit met un projet en pause
# après ~7 jours sans activité. On fait une petite lecture 2x/semaine
# (lundi + jeudi), ce qui remet le compteur d'inactivité à zéro.
# Déclenchement manuel possible via "Run workflow" (workflow_dispatch).

on:
  schedule:
    - cron: '17 6 * * 1,4'   # lundi et jeudi à 06:17 UTC (écart <= 4 jours, marge sous la pause à 7 j)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          # URL + clé PUBLISHABLE (publique par design, déjà présente dans index.html)
          URL="https://mqywmnylglrgbnjurppm.supabase.co/rest/v1/cart?select=list_id&limit=1"
          KEY="sb_publishable_BxeLUpWxJwtu9rA6MTaMyQ_gi6m9HTL"
          code=""
          for attempt in 1 2 3; do
            code=$(curl -sS -m 30 -o /dev/null -w "%{http_code}" \
              "$URL" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" || echo "000")
            echo "Tentative $attempt : HTTP $code"
            if [ "$code" = "200" ]; then break; fi
            sleep 10
          done
          if [ "$code" != "200" ]; then
            echo "::error::Ping Supabase échoué (HTTP $code) — le projet est peut-être en pause ; vérifie le dashboard."
            exit 1
          fi
          echo "OK — Supabase répond (HTTP 200). Projet maintenu actif."
